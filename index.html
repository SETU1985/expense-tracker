<title>Expense Manager</title>
<style>
:root{
  --paper:#F6F3EA; --card:#FFFFFF; --ink:#1C2B24; --mut:#6B7A72;
  --green:#123B2A; --green2:#1F7A4D; --gold:#C29B3C; --gold2:#E7CE8F;
  --red:#B3402A; --line:#E4DFD2; --chip:#EEF3EE;
  --r:14px; --sh:0 1px 3px rgba(20,40,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;padding-bottom:78px}
.num{font-variant-numeric:tabular-nums;letter-spacing:.2px}
header.app{position:sticky;top:0;z-index:30;background:var(--green);color:#F4EDDA;padding:12px 14px calc(10px + env(safe-area-inset-top,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
header.app .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#C29B3C,#8A6A1E);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#123B2A;font-family:Georgia,serif}
header.app h1{font-size:15.5px;font-weight:700;letter-spacing:.6px;flex:1;font-family:Georgia,'Times New Roman',serif}
header.app .ver{font-size:10px;opacity:.75;display:block;letter-spacing:2px;font-family:-apple-system,sans-serif;font-weight:500}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#F4EDDA;border-radius:10px;padding:7px 11px;font-size:14px}
main{padding:12px;max-width:760px;margin:0 auto}
h2.sec{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px;font-weight:700}
/* passbook strip */
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pass{min-width:150px;flex:0 0 auto;border-radius:16px;padding:12px 14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh)}
.pass::after{content:"";position:absolute;top:0;right:0;width:8px;height:100%;background:linear-gradient(180deg,var(--gold2),var(--gold))}
.pass.cash{background:linear-gradient(135deg,#1F7A4D,#123B2A)}
.pass.bank{background:linear-gradient(135deg,#28527A,#152C44)}
.pass.cardp{background:linear-gradient(135deg,#7A2E2E,#3F1414)}
.pass .t{font-size:11px;opacity:.85;letter-spacing:.8px;text-transform:uppercase}
.pass .v{font-size:20px;font-weight:800;margin-top:4px}
.pass .s{font-size:11px;opacity:.8;margin-top:3px}
/* cards & rows */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .em{width:36px;height:36px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.item .nm{font-weight:600;font-size:14.5px}
.item .sub{font-size:12px;color:var(--mut);margin-top:1px}
.amt{font-weight:800;font-size:15px}
.amt.in{color:var(--green2)} .amt.out{color:var(--red)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mut);font-weight:600}
/* forms */
input,select,textarea{font:inherit;color:var(--ink);background:#FCFBF6;border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
label.f{display:block;font-size:11.5px;color:var(--mut);font-weight:700;margin:10px 0 4px;letter-spacing:.4px}
.bigamt{font-size:26px;font-weight:800;text-align:center;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.gold.on{background:var(--gold);border-color:var(--gold);color:#26200f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--green);color:#fff;width:100%}
.btn.sm{width:auto;padding:9px 13px;font-size:13.5px}
.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn.red{background:var(--red)} .btn.gold{background:var(--gold);color:#26200f}
.btn:active{transform:scale(.985)}
.two{display:flex;gap:8px}.two>*{flex:1}
/* mic */
.mic{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:19px;flex:0 0 auto}
.mic.rec{background:var(--red);border-color:var(--red);color:#fff;animation:pl 1s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px rgba(179,64,42,.15)}}
/* budget bar */
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:999px}
.bar>i.over{background:var(--red)}
/* bottom nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot button{flex:1;background:none;border:none;padding:9px 2px 7px;font-size:10.5px;color:var(--mut);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button .i{font-size:20px}
nav.bot button.on{color:var(--green)}
nav.bot button.on .i{transform:translateY(-1px)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(15,25,20,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--paper);width:100%;max-width:760px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:Georgia,serif;font-size:18px;margin-bottom:10px}
.xrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.x{background:var(--chip);border:none;border-radius:50%;width:32px;height:32px;font-size:15px}
canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px}
.tag.get{background:#E4F3EA;color:var(--green2)} .tag.give{background:#F8E7E2;color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:13.5px}
.mini{font-size:12px;color:var(--mut)}
.right{text-align:right}
.hide{display:none!important}
audio{display:none}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-weight:700;font-size:13.5px;color:var(--mut)}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--sh);cursor:pointer}
.ctile:active{border-color:var(--gold);transform:scale(.97)}
.ctile.add{border-style:dashed;background:transparent;box-shadow:none}
.ctile.sel{border-color:var(--green);border-width:2px;background:#EEF3EE}
.ctile .chint{font-size:9.5px;color:var(--mut);margin-top:2px}
.cem{font-size:22px;line-height:1.2}
.cnm{font-size:12px;font-weight:700;margin-top:3px;line-height:1.25;word-break:break-word}
.cbd{font-size:10.5px;color:var(--mut);margin-top:2px}
.fab{}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:45;
  width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,#1F7A4D,#123B2A);
  color:#fff;font-size:31px;line-height:1;box-shadow:0 6px 18px rgba(18,59,42,.42)}
#fab:active{transform:scale(.94)}
body.sheet-open #fab{display:none}
.insight{border-left:4px solid var(--gold);background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;box-shadow:var(--sh)}
</style>
</head>
<body>

<script>
/* Manifest and icons are real files next to this one — Chrome needs to fetch them by
   URL to install a proper app instead of a browser shortcut. */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

/* ================= DATA ================= */
const LS='pb_khata_v1';
let DB=JSON.parse(localStorage.getItem(LS)||'null')||{
  cashOpen:0, banks:[], cards:[], budget:0,
  cats:[],

  exps:[],   // {id,date,amt,cat,mode,note,aud,who}  mode:'cash'|bankId|cardId · who:'me'|'shop'
  led:[],    // {id,date,typ:'in'|'out',party,amt,mode,note,why,due,who}
  pays:[],   // card payments {id,date,cardId,from,amt}  from:'cash'|bankId
  tiles:[]   // one-tap shortcuts {id,nm,em,cat,who,note}
};
/* His real categories, in his words. Added by NAME so an existing install gains the
   missing ones without duplicating anything he already has or renamed. */
const WANT_CATS=[
  {nm:'Groceries',em:'🛒'},{nm:'Food & Dining',em:'🍽️'},{nm:'Utilities & Bills',em:'💡'},
  {nm:'Transport',em:'🚕'},{nm:'School Fees',em:'🎓'},{nm:'EMI & Loans',em:'🏦'},
  {nm:'Household',em:'🏠'},{nm:'Health',em:'💊'},{nm:'Family',em:'👨‍👩‍👦'},
  {nm:'Shopping',em:'🛍️'},{nm:'Shop — PARAMPARA',em:'🏪'},{nm:'Other',em:'📦'}];
/* Old name → new name. Renaming keeps the id, so nothing already recorded is orphaned. */
const RENAME={'ghar ka saman':'Groceries','khana-peena':'Food & Dining','bills & recharge':'Utilities & Bills',
  'mobile/net':'Utilities & Bills','cab / travel':'Transport','fuel/travel':'Transport',
  'school fee':'School Fees','emi / loan':'EMI & Loans','ghar':'Household','business':'Shop — PARAMPARA',
  'entertainment':'Food & Dining'};
const WANT_TILES=[
  {nm:'Groceries',em:'🛒',cat:'Groceries'},
  {nm:'Transport',em:'🚕',cat:'Transport'},
  {nm:'School fees',em:'🎓',cat:'School Fees'},
  {nm:'Bill payment',em:'💡',cat:'Utilities & Bills'},
  {nm:'Shop expense',em:'🏪',cat:'Shop — PARAMPARA',who:'shop'}];
function migrate(){
  DB.cats=DB.cats||[]; DB.tiles=DB.tiles||[]; DB.led=DB.led||[]; DB.exps=DB.exps||[];
  // rename first, so the "do I already have it" check sees the new names
  DB.cats.forEach(c=>{ const nn=RENAME[String(c.nm).toLowerCase()];
    if(nn){ c.nm=nn; const w=WANT_CATS.find(x=>x.nm===nn); if(w)c.em=w.em; } });
  // a rename can create twins — fold the empty one into the one that has entries
  const seen={};
  DB.cats=DB.cats.filter(c=>{ const k=c.nm.toLowerCase();
    if(!seen[k]){ seen[k]=c; return true; }
    const keep=seen[k];
    DB.exps.forEach(e=>{ if(e.cat===c.id)e.cat=keep.id; });
    (DB.tiles||[]).forEach(t=>{ if(t.cat===c.id)t.cat=keep.id; });
    if(!keep.bud&&c.bud)keep.bud=c.bud;
    return false; });
  const have=n=>DB.cats.some(c=>c.nm.toLowerCase()===n.toLowerCase());
  WANT_CATS.forEach(c=>{ if(!have(c.nm))DB.cats.push({id:uid(),nm:c.nm,em:c.em,bud:0}); });
  if(!DB.tiles.length){
    WANT_TILES.forEach(t=>{ const c=DB.cats.find(x=>x.nm===t.cat);
      DB.tiles.push({id:uid(),nm:t.nm,em:t.em,cat:c?c.id:'',who:t.who||'me'}); });
  }
  DB.exps.forEach(e=>{ if(!e.who)e.who='me'; });
  S();
}
function S(){localStorage.setItem(LS,JSON.stringify(DB))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=n=>'₹'+(Math.round(n)||0).toLocaleString('en-IN');
const today=()=>new Date().toISOString().slice(0,10);
const mkey=d=>(d||today()).slice(0,7);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlabel=k=>MN[+k.slice(5,7)-1]+' '+k.slice(0,4);
const dfmt=d=>{const x=new Date(d+'T00:00');return x.getDate()+' '+MN[x.getMonth()]};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){let t=document.getElementById('tst');if(!t){t=document.createElement('div');t.id='tst';t.style.cssText='position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#1C2B24;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88%';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}

/* ---- IndexedDB for voice notes ---- */
let idb;const idbReady=new Promise(res=>{const r=indexedDB.open('pb_khata_media',1);
r.onupgradeneeded=e=>e.target.result.createObjectStore('aud');
r.onsuccess=e=>{idb=e.target.result;res()};r.onerror=()=>res()});
function audPut(id,blob){return idbReady.then(()=>new Promise(r=>{if(!idb)return r();const t=idb.transaction('aud','readwrite');t.objectStore('aud').put(blob,id);t.oncomplete=r}))}
function audGet(id){return idbReady.then(()=>new Promise(r=>{if(!idb)return r(null);const q=idb.transaction('aud').objectStore('aud').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}))}
function audDel(id){return idbReady.then(()=>new Promise(r=>{if(!idb)return r();const t=idb.transaction('aud','readwrite');t.objectStore('aud').delete(id);t.oncomplete=r}))}

/* ================= BALANCES ================= */
function bankById(id){return DB.banks.find(b=>b.id===id)}
function cardById(id){return DB.cards.find(c=>c.id===id)}
function modeName(m){if(m==='cash')return'Cash';if(m==='open')return'📖 Opening balance';const b=bankById(m);if(b)return b.nm;const c=cardById(m);if(c)return c.nm+' 💳';return m}
function accBal(id){ // 'cash' or bankId
  let v=id==='cash'?(+DB.cashOpen||0):(+((bankById(id)||{}).open)||0);
  DB.led.forEach(l=>{
    if(l.typ==='xfer'){                       // own money moving — one side out, other in
      if(l.from===id)v-=+l.amt;
      if(l.to===id)v+=+l.amt;
      return;
    }
    if(l.mode===id)v+=l.typ==='in'?+l.amt:-l.amt});
  DB.exps.forEach(e=>{if(e.mode===id)v-=+e.amt});
  DB.pays.forEach(p=>{if(p.from===id)v-=+p.amt});
  return v}
function cardOut(id){const c=cardById(id);if(!c)return 0;let v=+c.open||0;
  DB.exps.forEach(e=>{if(e.mode===id)v+=+e.amt});
  DB.pays.forEach(p=>{if(p.cardId===id)v-=+p.amt});
  // EMI principal already inside outstanding; EMIs listed for bill only
  return v}
function emiActive(c,mk){ // EMIs of card c active in month mk
  return (c.emis||[]).filter(e=>{if(!e.start)return true;const s=e.start,tot=+e.tot||1;
    const idx=(+mk.slice(0,4)-+s.slice(0,4))*12+(+mk.slice(5,7)-+s.slice(5,7));
    return idx>=0&&idx<tot})}
function monthSpend(mk){return DB.exps.filter(e=>mkey(e.date)===mk).reduce((s,e)=>s+ +e.amt,0)}

/* ================= NAV ================= */
let CUR='home';
function go(t){CUR=t;document.querySelectorAll('nav.bot button').forEach(b=>b.classList.remove('on'));
  const nb=document.getElementById('nb_'+t);if(nb)nb.classList.add('on');
  ({home:renderHome,exp:renderExp,led:renderLed,card:renderCards,rep:renderRep})[t]();
  window.scrollTo(0,0)}
const M=()=>document.getElementById('main');

/* ================= HOME ================= */
function renderHome(){
  const mk=mkey(),sp=monthSpend(mk),bud=+DB.budget||0;
  const cardTot=DB.cards.reduce((s,c)=>s+cardOut(c.id),0);
  let strip=`<div class="pass cash" onclick="accPage('cash')"><div class="t">Cash</div><div class="v num">${fmt(accBal('cash'))}</div><div class="s">cash in hand ›</div></div>`;
  DB.banks.forEach(b=>strip+=`<div class="pass bank" onclick="accPage('${b.id}')"><div class="t">🏦 ${esc(b.nm)}</div><div class="v num">${fmt(accBal(b.id))}</div><div class="s">bank balance ›</div></div>`);
  DB.cards.forEach(c=>strip+=`<div class="pass cardp" onclick="accPage('${c.id}')"><div class="t">💳 ${esc(c.nm)}</div><div class="v num">${fmt(cardOut(c.id))}</div><div class="s">outstanding ›</div></div>`);
  strip+=`<div class="pass" style="background:transparent;border:1.5px dashed var(--line);color:var(--mut);display:flex;align-items:center;justify-content:center;min-width:120px" onclick="addAccQuick()">➕ Add<br>bank / card</div>`;
  const pct=bud?Math.min(100,sp/bud*100):0;
  M().innerHTML=`
  <div class="strip">${strip}</div>
  <div class="box" onclick="go('rep')" style="cursor:pointer">
    <div class="row between"><b>Spend — ${mlabel(mk)}</b><span class="amt out num">${fmt(sp)} ›</span></div>
    ${bud?`<div style="margin-top:8px" class="bar"><i class="${sp>bud?'over':''}" style="width:${pct}%"></i></div>
    <div class="row between mini" style="margin-top:5px"><span>Budget ${fmt(bud)}</span><span>${sp>bud?'⚠️ '+fmt(sp-bud)+' over budget':fmt(bud-sp)+' remaining'}</span></div>`
    :`<div class="mini" style="margin-top:6px">No budget set yet — set it in ⚙️ Settings</div>`}
  </div>

  ${cardTot?`<div class="box row between"><span>💳 Total card outstanding</span><b class="amt out num">${fmt(cardTot)}</b></div>`:''}
  ${aheadHTML()}
  ${lenDenHTML()}
  <h2 class="sec">Recent entries</h2>
  <div class="box">${lastEntriesHTML(8)}</div>`;
}
/* Lena-den at a glance — the number he needs before he answers the phone. */
/* Everything already known to be leaving, in date order. */
function commitments(days){
  const T=new Date(today()+'T00:00'), out=[];
  const within=d=>{const x=Math.round((d-T)/86400000);return x>=0&&x<=days?x:null};
  const nextOn=day=>{ if(!day)return null;
    const d=new Date(T); d.setDate(day);
    if(d<T){d.setMonth(d.getMonth()+1);d.setDate(day);}
    return d};
  // credit card bills — the outstanding is what he will be asked for
  DB.cards.forEach(c=>{
    const due=nextOn(+c.dueDay); if(!due)return;
    const n=within(due); if(n===null)return;
    const amt=cardOut(c.id); if(amt<=0)return;
    out.push({d:n,date:due.toISOString().slice(0,10),em:'💳',nm:c.nm+' bill',amt,kind:'card'});
  });
  // EMIs still running this month
  const mk=mkey();
  DB.cards.forEach(c=>emiActive(c,mk).forEach(e=>{
    const due=nextOn(+c.dueDay||5); const n=due?within(due):null; if(n===null)return;
    out.push({d:n,date:due.toISOString().slice(0,10),em:'🏦',nm:e.nm+' EMI',amt:+e.mo||0,kind:'emi'});
  }));
  // money he promised to return, and money owed to him coming due
  DB.led.forEach(l=>{ if(l.typ==='xfer'||!l.due)return;
    const d=new Date(l.due+'T00:00'); const n=within(d);
    if(n===null&&d>=T)return;
    const late=d<T;
    out.push({d:late?-1:n,date:l.due,em:l.typ==='in'?'🔴':'🟢',
      nm:l.party+(l.why?' · '+l.why:''),amt:+l.amt,
      kind:l.typ==='in'?'pay':'get',late});
  });
  // bills that repeat every month, if he has marked them
  (DB.tiles||[]).forEach(t=>{ if(!+t.rep)return;
    const due=nextOn(+t.rep); const n=due?within(due):null; if(n===null)return;
    out.push({d:n,date:due.toISOString().slice(0,10),em:t.em,nm:t.nm,amt:+t.amt||0,kind:'bill',guess:!t.amt});
  });
  return out.sort((a,b)=>a.d-b.d)}
function cashNow(){
  let v=accBal('cash'); DB.banks.forEach(b=>v+=accBal(b.id)); return v}
/* The one number he actually needs before deciding anything. */
function aheadHTML(){
  const list=commitments(30);
  const outgo=list.filter(x=>x.kind!=='get').reduce((s,x)=>s+x.amt,0);
  const incom=list.filter(x=>x.kind==='get').reduce((s,x)=>s+x.amt,0);
  if(!list.length)return '';
  const have=cashNow(), left=have+incom-outgo;
  const late=list.filter(x=>x.late).length;
  return `<div class="box" onclick="aheadView()" style="cursor:pointer;border-left:4px solid ${left<0?'var(--red)':'var(--green2)'}">
    <div class="row between"><b>📅 Agle 30 din</b><span class="mini">tap for details ›</span></div>
    <div class="row between" style="margin-top:8px">
      <div><div class="mini">Dena hai</div><b class="amt out num">${fmt(outgo)}</b></div>
      <div class="right"><div class="mini">Paas hai</div><b class="num">${fmt(have)}</b></div>
    </div>
    <div class="row between" style="margin-top:8px;border-top:1px dashed var(--line);padding-top:8px">
      <span>${left<0?'⚠️ Kam pad raha hai':'👍 Bach jayega'}</span>
      <b class="amt ${left<0?'out':'in'} num">${fmt(Math.abs(left))}</b></div>
    ${late?`<div class="mini" style="margin-top:6px;color:var(--red)">⏰ ${late} cheez ki tareekh nikal chuki hai</div>`:''}
  </div>`}
function aheadView(){
  const list=commitments(60);
  openSheet(`<div class="xrow"><h3>📅 Aage kya aa raha hai</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box row between"><span>Cash + Bank abhi</span><b class="num">${fmt(cashNow())}</b></div>
  <div class="box">${list.length?list.map(x=>`
    <div class="item"><div class="em">${x.em}</div>
      <div class="grow"><div class="nm">${esc(x.nm)}${x.guess?' <span class="mini">(amount set karo)</span>':''}</div>
        <div class="sub">${x.late?'<b style="color:var(--red)">tareekh nikal gayi</b> · ':(x.d===0?'<b>aaj</b> · ':x.d+' din baad · ')}${dfmt(x.date)}</div></div>
      <div class="amt ${x.kind==='get'?'in':'out'} num">${x.kind==='get'?'+':'-'}${fmt(x.amt)}</div></div>`).join('')
    :`<div class="empty">Abhi kuch pata nahi hai.<br>Card ki due date, udhaar ki return date, ya mahine ke pakke bill (⚡ Shortcuts me) set karoge toh yahan dikhega.</div>`}</div>
  <div class="mini">💡 Har mahine aane wale bill — school fee, cylinder, phone — ⚡ Shortcuts me "har mahine" set kar do, phir wo bhi yahan apne aap aa jayenge.</div>`)}
function lenDenHTML(){
  const m=partyBalances();
  let get=0,give=0; Object.values(m).forEach(v=>{ if(v>0)get+=v; else give+=-v; });
  const od=DB.led.filter(l=>l.due&&new Date(l.due+'T00:00')<new Date(today()+'T00:00'));
  if(!get&&!give)return '';
  return `<div class="box" onclick="go('led')" style="cursor:pointer">
    <div class="row between"><b>🤝 Lena-Den</b><span class="mini">tap for details ›</span></div>
    <div class="row between" style="margin-top:8px">
      <div><div class="mini">Aapko milna hai</div><b class="amt in num">${fmt(get)}</b></div>
      <div class="right"><div class="mini">Aapko dena hai</div><b class="amt out num">${fmt(give)}</b></div>
    </div>
    ${od.length?`<div class="mini" style="margin-top:8px;color:var(--red)">⏰ ${od.length} entry ki return date nikal chuki hai</div>`:''}
  </div>`}
function lastEntriesHTML(n){
  const all=[...DB.exps.map(e=>({...e,_k:'e'})),...DB.led.map(l=>({...l,_k:'l'})),...DB.pays.map(p=>({...p,_k:'p'}))]
   .sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,n);
  if(!all.length)return`<div class="empty">No entries yet.<br>First set your opening balances in ⚙️ Settings, then start adding expenses.</div>`;
  return all.map(x=>{
    if(x._k==='e')return expRow(x);
    if(x._k==='l'){
      if(x.typ==='xfer')return rowHTML('🔄',esc(modeName(x.from))+' → '+esc(modeName(x.to)),dfmt(x.date)+' · transfer',fmt(x.amt),'');
      return rowHTML(x.typ==='in'?'⬇️':'⬆️',esc(x.party||'—')+(x.why?' · '+esc(x.why):''),dfmt(x.date)+' · '+modeName(x.mode)+(x.note?' · '+esc(x.note):''),(x.typ==='in'?'+':'-')+fmt(x.amt),x.typ==='in'?'in':'out')}
    return rowHTML('💳','Card payment · '+esc((cardById(x.cardId)||{}).nm||''),dfmt(x.date)+' · from '+modeName(x.from),'-'+fmt(x.amt),'out')
  }).join('')}
function rowHTML(em,nm,sub,amt,cls,audId){
  return`<div class="item"><div class="em">${em}</div><div class="grow"><div class="nm">${nm}</div><div class="sub">${sub}</div></div>
  ${audId?`<button class="mic" style="width:34px;height:34px;font-size:14px" onclick="playAud('${audId}')">▶️</button>`:''}
  <div class="amt ${cls} num">${amt}</div></div>`}
async function playAud(id){const b=await audGet(id);if(!b)return toast('Recording not found');
  const u=URL.createObjectURL(b);const a=new Audio(u);a.onended=()=>URL.revokeObjectURL(u);a.play()}

/* ================= EXPENSE (entry line on TOP, list below) ================= */
let F={cat:null,mode:'cash',aud:null,who:'me'};
function manageTiles(){
  openSheet(`<div class="xrow"><h3>⚡ Shortcuts</h3><button class="x" onclick="setBack()">‹</button></div>
  <div class="mini" style="margin-bottom:10px">Jo kharche baar-baar hote hain unke buttons. Expenses screen pe tap karoge toh category apne aap set ho jayegi.</div>
  <div class="cgrid">
    ${(DB.tiles||[]).map(t=>tileTile(t)).join('')}
    <div class="ctile add" onclick="tileEdit('')"><div class="cem">➕</div><div class="cnm">Add</div></div>
  </div>`)}
function tileTile(t){const c=DB.cats.find(x=>x.id===t.cat);
  return`<div class="ctile" onclick="tileEdit('${t.id}')">
    <div class="cem">${t.em||'🏷️'}</div>
    <div class="cnm">${esc(t.nm)}</div>
    <div class="cbd">${+t.rep?('📅 day '+t.rep):(t.who==='shop'?'🏪 Shop':(c?esc(c.nm):'—'))}</div>
    <div class="chint">tap to edit</div></div>`}
function tileEdit(id){
  const t=id?(DB.tiles||[]).find(x=>x.id===id):{em:'🏷️',nm:'',cat:(DB.cats[0]||{}).id,who:'me'};
  if(!t)return;
  openSheet(`<div class="xrow"><h3>${id?'Edit shortcut':'New shortcut'}</h3><button class="x" onclick="manageTiles()">‹</button></div>
  <div class="row" style="gap:8px">
    <input id="te_em" value="${esc(t.em||'🏷️')}" style="flex:0 0 64px;text-align:center;font-size:24px">
    <input id="te_nm" value="${esc(t.nm||'')}" placeholder="Ghar ka saman, School fee..." class="grow">
  </div>
  <label class="f">CATEGORY</label>
  <select id="te_cat">${DB.cats.map(c=>`<option value="${c.id}" ${t.cat===c.id?'selected':''}>${c.em} ${esc(c.nm)}</option>`).join('')}</select>
  <label class="f">KISKE LIYE?</label>
  <select id="te_who"><option value="me" ${t.who!=='shop'?'selected':''}>🏠 Personal</option><option value="shop" ${t.who==='shop'?'selected':''}>🏪 Shop — PARAMPARA</option></select>
  <label class="f">HAR MAHINE AATA HAI? (optional)</label>
  <div class="row" style="gap:8px">
    <input id="te_rep" type="number" inputmode="numeric" min="1" max="31" value="${t.rep||''}" placeholder="Mahine ki tareekh" class="grow">
    <input id="te_amt" type="number" inputmode="numeric" value="${t.amt||''}" placeholder="₹ kitna" style="flex:1">
  </div>
  <div class="mini" style="margin-top:6px">Bharoge toh 📅 "Agle 30 din" me apne aap dikhega — school fee, cylinder, phone bill jaise pakke kharche.</div>
  <button class="btn" style="margin-top:16px" onclick="tileSave('${id}')">💾 Save</button>
  ${id?`<button class="btn red" style="margin-top:8px" onclick="tileDel('${id}')">🗑️ Delete</button>`:''}`)}
function tileSave(id){
  const nm=document.getElementById('te_nm').value.trim();
  if(!nm)return toast('Name likho');
  const obj={em:document.getElementById('te_em').value.trim()||'🏷️',nm,
    cat:document.getElementById('te_cat').value,who:document.getElementById('te_who').value,
    rep:+document.getElementById('te_rep').value||0, amt:+document.getElementById('te_amt').value||0};
  DB.tiles=DB.tiles||[];
  if(id){Object.assign(DB.tiles.find(x=>x.id===id),obj)}else{DB.tiles.push(Object.assign({id:uid()},obj))}
  S();closeSheet();toast('✅ Saved');go(CUR)}
function tileDel(id){
  if(!confirm('Delete this shortcut?'))return;
  DB.tiles=(DB.tiles||[]).filter(t=>t.id!==id);S();toast('✅ Deleted');manageTiles()}
function renderExp(){
  const mk=mkey();

function importSheet(){
  openSheet(`<div class="xrow"><h3>📥 Statement import</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="mini" style="margin-bottom:8px">Send your card/bank statement (photo, PDF or copied text) <b>to Claude</b> — it will explain every line and give you an import code. Paste that code here. Simple lines also work:<br><span style="font-family:monospace">2026-07-20 | 450 | Khana | HDFC Card | Swiggy dinner</span></div>
  <textarea id="im_txt" rows="8" placeholder='Paste here — Claude import code or one line per entry'></textarea>
  <button class="btn" style="margin-top:10px" onclick="parseImport(false)">👀 Preview first</button>
  <div id="im_prev" style="margin-top:10px"></div>`)}
function matchCat(s){s=(s||'').toLowerCase();
  let c=DB.cats.find(k=>k.nm.toLowerCase()===s)||DB.cats.find(k=>k.nm.toLowerCase().includes(s)||s.includes(k.nm.toLowerCase()));
  return c?c.id:(DB.cats.find(k=>/other/i.test(k.nm))||DB.cats[DB.cats.length-1]).id}
function matchMode(s){s=(s||'').toLowerCase();if(!s||/cash/.test(s))return'cash';
  let b=DB.banks.find(x=>s.includes(x.nm.toLowerCase())||x.nm.toLowerCase().includes(s));if(b)return b.id;
  let c=DB.cards.find(x=>s.includes(x.nm.toLowerCase())||x.nm.toLowerCase().includes(s));if(c)return c.id;
  if(/card/.test(s)&&DB.cards[0])return DB.cards[0].id;
  if(/bank|upi|gpay|neft|imps/.test(s)&&DB.banks[0])return DB.banks[0].id;
  return'cash'}
function parseImport(save){
  const t=document.getElementById('im_txt').value.trim();if(!t)return toast('Paste something first');
  let rows=[];
  try{const j=JSON.parse(t);if(Array.isArray(j))rows=j.map(r=>({d:r.d||r.date,a:+(r.a||r.amt||r.amount),c:r.c||r.cat||'',m:r.m||r.mode||'',n:r.n||r.note||''}))}catch(_){
    rows=t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split(/\s*[|,;]\s*/);
      return{d:p[0],a:+p[1],c:p[2]||'',m:p[3]||'',n:p[4]||''}})}
  rows=rows.filter(r=>r.d&&/^\d{4}-\d{2}-\d{2}/.test(r.d)&&r.a>0);
  if(!rows.length)return document.getElementById('im_prev').innerHTML='<div class="empty">No valid lines found. Format: date | amount | category | paid-from | note</div>';
  let dup=0;const fresh=rows.filter(r=>{const ex=DB.exps.some(e=>e.date===r.d.slice(0,10)&&+e.amt===r.a&&(e.note||'')===(r.n||''));if(ex)dup++;return!ex});
  if(!save){
    document.getElementById('im_prev').innerHTML=
    `<div class="box">${rows.slice(0,50).map(r=>{const cid=matchCat(r.c),c=DB.cats.find(x=>x.id===cid);
      return`<div class="mini" style="padding:3px 0">• ${dfmt(r.d.slice(0,10))} — <b>${fmt(r.a)}</b> — ${c.em} ${esc(c.nm)} — ${esc(modeName(matchMode(r.m)))}${r.n?' — '+esc(r.n):''}</div>`}).join('')}</div>
    <div class="mini" style="margin:6px 0">${rows.length} entries found${dup?' · '+dup+' duplicates will be skipped':''}</div>
    <button class="btn gold" onclick="parseImport(true)">✅ Save ${fresh.length} entries</button>`;
    return}
  fresh.forEach(r=>DB.exps.push({id:uid(),date:r.d.slice(0,10),amt:r.a,cat:matchCat(r.c),mode:matchMode(r.m),note:(r.n||'').trim(),aud:false}));
  S();closeSheet();toast('✅ '+fresh.length+' entries imported'+(dup?' ('+dup+' duplicates skipped)':''));renderExp()}

/* ---- voice recording ---- */
let mediaRec=null,recChunks=[];
async function toggleRec(){
  const mic=document.getElementById('e_mic');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];mediaRec=new MediaRecorder(st);
    mediaRec.ondataavailable=e=>recChunks.push(e.data);
    mediaRec.onstop=()=>{st.getTracks().forEach(t=>t.stop());
      F.aud=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      mic.classList.remove('rec');document.getElementById('e_recmsg').classList.add('hide');
      document.getElementById('e_hasaud').classList.remove('hide')};
    mediaRec.start();mic.classList.add('rec');
    document.getElementById('e_recmsg').classList.remove('hide');
    document.getElementById('e_hasaud').classList.add('hide');
  }catch(err){toast('Microphone permission denied')}}
function dropRec(){F.aud=null;document.getElementById('e_hasaud').classList.add('hide')}

/* A return date he set himself, surfaced on the day it matters. */
function dueSoonHTML(){
  const T=new Date(today()+'T00:00');
  const list=DB.led.filter(l=>l.due).map(l=>({l,d:Math.round((new Date(l.due+'T00:00')-T)/86400000)}))
    .filter(x=>x.d<=7).sort((a,b)=>a.d-b.d);
  if(!list.length)return '';
  return `<h2 class="sec">⏰ Yaad dilana hai</h2><div class="box">${list.map(x=>
    `<div class="item"><div class="em">${x.d<0?'🔴':'🟡'}</div>

     <div class="amt ${x.l.typ==='out'?'in':'out'} num">${fmt(x.l.amt)}</div></div>`).join('')}</div>`}
function partyBalances(){const m={};DB.led.forEach(l=>{
  if(l.typ==='xfer'||!l.party)return;         // a transfer is nobody's debt
  m[l.party]=(m[l.party]||0)+(l.typ==='out'?+l.amt:-l.amt)});return m}
function partyHTML(){const m=partyBalances();const ks=Object.keys(m).filter(p=>Math.round(m[p])!==0);
  if(!ks.length)return`<div class="empty">No open balances. Add a party name on IN/OUT entries (or an 📖 Opening balance) and the running balance will build here.</div>`;
  return ks.sort((a,b)=>Math.abs(m[b])-Math.abs(m[a])).map(p=>{const v=m[p];
   return`<div class="item" onclick="partyView('${esc(p).replace(/'/g,"\\'")}')" style="cursor:pointer"><div class="em">${v>0?'🟢':'🔴'}</div>
   <div class="grow"><div class="nm">${esc(p)}</div><div class="sub">${v>0?'To receive — Debtor':'To pay — Creditor'}</div></div>
   <span class="tag ${v>0?'get':'give'}">${fmt(Math.abs(v))}</span></div>`}).join('')}
function dueTag(l){ if(!l.due)return '';
  const d=Math.round((new Date(l.due+'T00:00')-new Date(today()+'T00:00'))/86400000);
  if(d<0)return ` · <b style="color:var(--red)">${-d}d late</b>`;
  if(d===0)return ` · <b style="color:var(--red)">due today</b>`;
  if(d<=7)return ` · <b style="color:var(--gold)">due in ${d}d</b>`;
  return ` · due ${dfmt(l.due)}` }
function partyView(p){const rows=DB.led.filter(l=>l.party===p).sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id));
  const bal=partyBalances()[p]||0;
  openSheet(`<div class="xrow"><h3>🤝 ${esc(p)}</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box row between"><span>Net balance</span><span class="tag ${bal>0?'get':'give'}">${bal>0?'To receive ':'To pay '}${fmt(Math.abs(bal))}</span></div>
  <div class="box">${rows.map(l=>rowHTML(l.typ==='in'?'⬇️':'⬆️',
    (l.why||(l.typ==='in'?'Received':'Given'))+(l.note?' · <span style="font-weight:500">'+esc(l.note)+'</span>':''),
    dfmt(l.date)+' · '+modeName(l.mode)+dueTag(l),
    (l.typ==='in'?'+':'-')+fmt(l.amt),l.typ==='in'?'in':'out')).join('')}</div>
  <button class="btn ghost" style="margin-top:10px" onclick="waParty('${esc(p).replace(/'/g,"\\'")}')">💬 Send this account on WhatsApp</button>`)}
/* The account in plain words, so a disagreement is settled by showing it, not arguing. */
function waParty(p){
  const rows=DB.led.filter(l=>l.party===p).sort((a,b)=>(a.date+a.id).localeCompare(b.date+b.id));
  const bal=partyBalances()[p]||0;
  let t='*'+p+'* — hisaab\n\n';
  rows.forEach(l=>{ t+=dfmt(l.date)+'  '+(l.typ==='in'?'liya':'diya')+'  '+fmt(l.amt)
    +(l.why?'  ('+l.why+')':'')+'\n'; });
  t+='\n'+(bal>0?'Aapse lena hai: ':bal<0?'Aapko dena hai: ':'Hisaab barabar: ')+fmt(Math.abs(bal));
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
function ledListHTML(){const L2=[...DB.led].sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)).slice(0,40);
  if(!L2.length)return`<div class="empty">No ledger entries yet.</div>`;
  return L2.map(l=>{
   if(l.typ==='xfer')return`<div class="item"><div class="em">🔄</div>
    <div class="grow"><div class="nm">${esc(modeName(l.from))} → ${esc(modeName(l.to))}</div>
    <div class="sub">${dfmt(l.date)} · transfer${l.note?' · '+esc(l.note):''}</div></div>
    <div class="amt num" style="color:var(--mut)">${fmt(l.amt)}</div>
    <button class="x" onclick="delLed('${l.id}')">🗑️</button></div>`;
   return`<div class="item"><div class="em">${l.typ==='in'?'⬇️':'⬆️'}</div>
  <div class="grow"><div class="nm">${esc(l.party||'—')}${l.why?' · <span style="font-weight:500">'+esc(l.why)+'</span>':''}</div>
  <div class="sub">${dfmt(l.date)} · ${modeName(l.mode)}${dueTag(l)}${l.note?' · '+esc(l.note):''}</div></div>
  <div class="amt ${l.typ==='in'?'in':'out'} num">${l.typ==='in'?'+':'-'}${fmt(l.amt)}</div>
  <button class="x" onclick="delLed('${l.id}')">🗑️</button></div>`}).join('')}
function saveLed(){const amt=+document.getElementById('l_amt').value;
  if(!amt||amt<=0)return toast('Enter the amount');
  const party=document.getElementById('l_party').value.trim();
  if(!party)return toast('Kiska naam? Party likhna zaroori hai');
  const why=(document.getElementById('l_why').value.trim())||L.why||'';
  DB.led.push({id:uid(),date:document.getElementById('l_date').value||today(),typ:L.typ,
    party,amt,mode:L.mode,why,due:document.getElementById('l_due').value||'',
    note:document.getElementById('l_note').value.trim()});
  S();L.why='';L.due='';
  toast('✅ '+(L.typ==='in'?'IN':'OUT')+' saved — '+fmt(amt));renderLed()}
function delLed(id){if(!confirm('Delete this entry?'))return;DB.led=DB.led.filter(l=>l.id!==id);S();renderLed()}


/* ================= ACCOUNT PAGE (bank, cash or card) =================
   Multiple banks and cards is the normal case, so each one needs its own page: what
   it holds today, every line that moved through it, a date range he chooses, and a
   printable statement. */
let AP={id:null,from:'',to:''};
function accIsCard(id){return !!cardById(id)}
function accTitle(id){ if(id==='cash')return '💵 Cash';
  const b=bankById(id); if(b)return '🏦 '+b.nm;
  const c=cardById(id); return c?'💳 '+c.nm:'—'}
/* Every line that touched this account, newest first. */
function accLines(id){
  const out=[];
  DB.exps.forEach(e=>{ if(e.mode!==id)return; const c=DB.cats.find(x=>x.id===e.cat)||{em:'📦',nm:'Other'};
    out.push({date:e.date,em:c.em,nm:c.nm+(e.note?' · '+e.note:''),sub:e.who==='shop'?'🏪 Shop':'Expense',amt:-e.amt}); });
  DB.led.forEach(l=>{
    if(l.typ==='xfer'){
      if(l.from===id)out.push({date:l.date,em:'🔄',nm:'Transfer to '+modeName(l.to),sub:l.note||'',amt:-l.amt});
      if(l.to===id)out.push({date:l.date,em:'🔄',nm:'Transfer from '+modeName(l.from),sub:l.note||'',amt:+l.amt});
      return; }
    if(l.mode!==id)return;
    out.push({date:l.date,em:l.typ==='in'?'⬇️':'⬆️',nm:(l.party||'—')+(l.why?' · '+l.why:''),
      sub:l.typ==='in'?'Received':'Given',amt:l.typ==='in'?+l.amt:-l.amt}); });
  DB.pays.forEach(pp=>{
    if(pp.from===id)out.push({date:pp.date,em:'💳',nm:'Card payment · '+((cardById(pp.cardId)||{}).nm||''),sub:'Paid out',amt:-pp.amt});
    if(pp.cardId===id)out.push({date:pp.date,em:'✅',nm:'Bill payment received',sub:'Reduces outstanding',amt:-pp.amt}); });
  return out.sort((a,b)=>b.date.localeCompare(a.date))}
function accPage(id){
  AP.id=id; if(!AP.from){const d=new Date();d.setMonth(d.getMonth()-1);AP.from=d.toISOString().slice(0,10);AP.to=today();}
  renderAccPage()}
function renderAccPage(){
  const id=AP.id, card=accIsCard(id);
  const all=accLines(id);
  const rows=all.filter(r=>(!AP.from||r.date>=AP.from)&&(!AP.to||r.date<=AP.to));
  const inn=rows.filter(r=>r.amt>0).reduce((s,r)=>s+r.amt,0);
  const out=rows.filter(r=>r.amt<0).reduce((s,r)=>s-r.amt,0);
  openSheet(`<div class="xrow"><h3>${accTitle(id)}</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box">
    <div class="row between"><span>${card?'Outstanding (payable)':'Balance today'}</span>
      <b class="amt ${card?'out':'in'} num" style="font-size:20px">${fmt(card?cardOut(id):accBal(id))}</b></div>
    ${card?`<button class="btn gold" style="margin-top:10px" onclick="payForm('${id}')">💰 Record bill payment</button>
      <button class="btn ghost" style="margin-top:8px" onclick="cardForm('${id}')">✏️ Edit card / EMIs</button>`
    :(id==='cash'?`<button class="btn ghost" style="margin-top:10px" onclick="closeSheet();setMoney()">✏️ Edit opening balance</button>`
      :`<button class="btn ghost" style="margin-top:10px" onclick="closeSheet();setBanks()">✏️ Edit bank</button>`)}
  </div>
  ${accBreakdownHTML(id)}
  <h2 class="sec">Statement</h2>
  <div class="box">
    <div class="row" style="gap:8px">
      <div class="grow"><label class="f">FROM</label><input type="date" id="ap_from" value="${AP.from}" onchange="AP.from=this.value;renderAccPage()"></div>
      <div class="grow"><label class="f">TO</label><input type="date" id="ap_to" value="${AP.to}" onchange="AP.to=this.value;renderAccPage()"></div>
    </div>
    <div class="chips" style="margin-top:8px">
      <button class="chip" onclick="apRange(1)">1 month</button>
      <button class="chip" onclick="apRange(3)">3 months</button>
      <button class="chip" onclick="apRange(12)">1 year</button>
      <button class="chip" onclick="apRange(0)">All</button>
    </div>
    <div class="row between" style="margin-top:10px">
      <span class="pill">⬇️ In ${fmt(inn)}</span><span class="pill">⬆️ Out ${fmt(out)}</span>
      <span class="pill">${rows.length} entries</span>
    </div>
    <button class="btn ghost" style="margin-top:10px" onclick="accPrint()">📄 Download / print PDF</button>
  </div>
  <div class="box">${rows.length?rows.map(r=>
    `<div class="item"><div class="em">${r.em}</div><div class="grow">
      <div class="nm">${esc(r.nm)}</div><div class="sub">${dfmt(r.date)}${r.sub?' · '+esc(r.sub):''}</div></div>
     <div class="amt ${r.amt>0?'in':'out'} num">${r.amt>0?'+':'-'}${fmt(Math.abs(r.amt))}</div></div>`).join('')
    :`<div class="empty">Is period me koi entry nahi.</div>`}</div>`)}
/* Where the money on this account actually went, for the chosen dates. */
function accBreakdownHTML(id){
  const E=DB.exps.filter(e=>e.mode===id&&(!AP.from||e.date>=AP.from)&&(!AP.to||e.date<=AP.to));
  if(!E.length)return '';
  const tot=E.reduce((s,e)=>s+ +e.amt,0);
  const by={}; E.forEach(e=>by[e.cat]=(by[e.cat]||0)+ +e.amt);
  const cats=DB.cats.map(c=>({c,v:by[c.id]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const big=[...E].sort((a,b)=>b.amt-a.amt).slice(0,5);
  // small amounts that keep repeating are the ones nobody notices
  const cnt={}; E.forEach(e=>{const k=(e.note||'').trim().toLowerCase()||'(no note)';
    if(!cnt[k])cnt[k]={n:0,v:0,label:(e.note||'').trim()||'—'}; cnt[k].n++; cnt[k].v+=+e.amt;});
  const rep=Object.values(cnt).filter(x=>x.n>=3).sort((a,b)=>b.v-a.v).slice(0,3);
  return `<h2 class="sec">Paisa kahan gaya</h2>
  <div class="box">
    <div class="row between"><span class="mini">${E.length} spends in this period</span><b class="num">${fmt(tot)}</b></div>
    <div style="margin-top:10px">${cats.map(x=>`
      <div style="padding:6px 0">
        <div class="row between"><span>${x.c.em} ${esc(x.c.nm)}</span>
          <span class="num">${fmt(x.v)} <span class="mini">${Math.round(x.v/tot*100)}%</span></span></div>
        <div class="bar" style="height:6px;margin-top:4px"><i style="width:${Math.round(x.v/tot*100)}%"></i></div>
      </div>`).join('')}</div>
  </div>
  <h2 class="sec">Sabse bade kharche</h2>
  <div class="box">${big.map(e=>{const c=DB.cats.find(k=>k.id===e.cat)||{em:'📦',nm:'Other'};
    return `<div class="item" onclick="editExp('${e.id}')" style="cursor:pointer">
      <div class="em">${c.em}</div><div class="grow">
        <div class="nm">${esc(e.note||c.nm)}</div><div class="sub">${dfmt(e.date)} · ${esc(c.nm)}</div></div>
      <div class="amt out num">−${fmt(e.amt)}</div></div>`}).join('')}</div>
  ${rep.length?`<h2 class="sec">Baar-baar ho raha hai</h2>
  <div class="box"><div class="mini" style="padding:2px 2px 8px">Chhote kharche jo dohrate hain — yahin paisa chupke se nikal jaata hai.</div>
  ${rep.map(x=>`<div class="item"><div class="em">🔁</div>
    <div class="grow"><div class="nm">${esc(x.label)}</div><div class="sub">${x.n} times</div></div>
    <div class="amt out num">−${fmt(x.v)}</div></div>`).join('')}</div>`:''}`}
function apRange(m){
  if(!m){AP.from='2000-01-01';AP.to=today();}
  else{const d=new Date();d.setMonth(d.getMonth()-m);AP.from=d.toISOString().slice(0,10);AP.to=today();}
  renderAccPage()}
/* Android's print dialog has "Save as PDF", so one button covers both. */
function accPrint(){
  const id=AP.id, card=accIsCard(id);
  const rows=accLines(id).filter(r=>(!AP.from||r.date>=AP.from)&&(!AP.to||r.date<=AP.to));
  const inn=rows.filter(r=>r.amt>0).reduce((s,r)=>s+r.amt,0);
  const out=rows.filter(r=>r.amt<0).reduce((s,r)=>s-r.amt,0);
  const w=window.open('','_blank');
  if(!w)return toast('Popup blocked — allow popups for this site');
  w.document.write(`<html><head><title>${accTitle(id)} statement</title><meta charset="utf-8">
  <style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:18px;color:#1C2B24}
  h1{font-size:19px;margin:0 0 2px}.sub{color:#6B7A72;font-size:12px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;border-bottom:2px solid #123B2A;padding:6px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td{border-bottom:1px solid #E4DFD2;padding:6px 4px}
  .r{text-align:right;font-variant-numeric:tabular-nums}.neg{color:#B3402A}.pos{color:#1F7A4D}
  .tot{margin-top:14px;font-size:13px}.tot b{font-size:15px}</style></head><body>
  <h1>${accTitle(id)} — Statement</h1>
  <div class="sub">${dfmt(AP.from)} to ${dfmt(AP.to)} · printed ${dfmt(today())}</div>
  <table><tr><th>Date</th><th>Details</th><th class="r">Amount</th></tr>
  ${rows.map(r=>`<tr><td>${dfmt(r.date)}</td><td>${esc(r.nm)}${r.sub?' <span style="color:#6B7A72">· '+esc(r.sub)+'</span>':''}</td>
    <td class="r ${r.amt>0?'pos':'neg'}">${r.amt>0?'+':'-'}${fmt(Math.abs(r.amt))}</td></tr>`).join('')}
  </table>
  <div class="tot">In ${fmt(inn)} &nbsp;·&nbsp; Out ${fmt(out)} &nbsp;·&nbsp;
    ${card?'Outstanding':'Balance today'}: <b>${fmt(card?cardOut(id):accBal(id))}</b></div>
  </body></html>`);
  w.document.close(); setTimeout(()=>{try{w.print()}catch(e){}},400)}

/* ================= CARDS ================= */
function renderCards(){
  M().innerHTML=`
  <button class="btn ghost" style="margin-bottom:10px" onclick="cardForm()">➕ Add credit card</button>
  ${DB.cards.length?DB.cards.map(c=>cardBoxHTML(c)).join(''):`<div class="box empty">No cards added yet.<br>Add a card to manage its outstanding, EMIs and bill payments here.</div>`}`;
}
function cardBoxHTML(c){const out=cardOut(c.id),mk=mkey();
  const emis=emiActive(c,mk),emiTot=emis.reduce((s,e)=>s+ +e.mo,0);
  const spends=DB.exps.filter(e=>e.mode===c.id&&mkey(e.date)===mk).reduce((s,e)=>s+ +e.amt,0);
  return`<div class="box">
    <div class="row between"><b>💳 ${esc(c.nm)}</b>
      <div class="row" style="gap:6px"><button class="btn sm ghost" onclick="accPage('${c.id}')">📄 Statement</button>
      <button class="btn sm ghost" onclick="billCheck('${c.id}')">🧮 Bill check</button>
      <button class="btn sm ghost" onclick="cardForm('${c.id}')">✏️</button></div></div>
    <div class="row between" style="margin-top:8px"><span class="mini">Current outstanding</span><b class="amt out num" style="font-size:18px">${fmt(out)}</b></div>
    <div class="row between" style="margin-top:4px"><span class="mini">Spent on this card this month</span><span class="num">${fmt(spends)}</span></div>
    ${emis.length?`<div class="row between" style="margin-top:4px"><span class="mini">Active EMIs (${emis.length})</span><span class="num">${fmt(emiTot)}/month</span></div>
      ${emis.map(e=>`<div class="mini" style="margin-left:8px">• ${esc(e.nm)} — ${fmt(e.mo)} × ${emiLeft(e,mk)} months left</div>`).join('')}`:''}
    ${c.billDay?`<div class="mini" style="margin-top:6px">📅 Bill date: ${c.billDay} of every month${c.dueDay?' · Due date: '+c.dueDay:''}</div>`:''}
    <button class="btn gold" style="margin-top:10px" onclick="payForm('${c.id}')">💰 Record bill payment</button>
  </div>`}
function emiLeft(e,mk){if(!e.start)return e.tot||'?';
  const idx=(+mk.slice(0,4)-+e.start.slice(0,4))*12+(+mk.slice(5,7)-+e.start.slice(5,7));
  return Math.max(0,(+e.tot||0)-idx)}
function cardForm(id){const c=id?cardById(id):{nm:'',open:0,billDay:'',dueDay:'',emis:[]};
  openSheet(`<div class="xrow"><h3>${id?'✏️ Edit card':'➕ New card'}</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <label class="f">CARD NAME</label><input id="c_nm" value="${esc(c.nm)}" placeholder="HDFC Regalia / SBI...">
  <label class="f">CURRENT OUTSTANDING (as per latest statement)</label><input id="c_open" type="number" inputmode="decimal" value="${c.open||''}" placeholder="₹ from your statement">
  <div class="two"><div><label class="f">BILL DATE (1-31)</label><input id="c_bd" type="number" value="${c.billDay||''}" placeholder="15"></div>
  <div><label class="f">DUE DATE (1-31)</label><input id="c_dd" type="number" value="${c.dueDay||''}" placeholder="3"></div></div>
  <label class="f">ACTIVE EMIs (name · ₹/month · total months · start month)</label>
  <div id="c_emis">${(c.emis||[]).map((e,i)=>emiRow(e,i)).join('')}</div>
  <button class="btn sm ghost" style="margin-top:6px" onclick="addEmiRow()">➕ Add EMI</button>
  <button class="btn" style="margin-top:14px" onclick="saveCard('${id||''}')">💾 Save</button>
  ${id?`<button class="btn red" style="margin-top:8px" onclick="delCard('${id}')">🗑️ Delete card</button>`:''}`)}
function emiRow(e,i){return`<div class="row" style="gap:6px;margin-top:6px" data-emi>
  <input placeholder="Phone EMI" value="${esc(e.nm||'')}" data-enm style="flex:2">
  <input type="number" placeholder="₹/mo" value="${e.mo||''}" data-emo style="flex:1">
  <input type="number" placeholder="months" value="${e.tot||''}" data-etot style="flex:1">
  <input type="month" value="${e.start||''}" data-est style="flex:1.4">
  <button class="x" onclick="this.parentElement.remove()">✕</button></div>`}
function addEmiRow(){document.getElementById('c_emis').insertAdjacentHTML('beforeend',emiRow({},0))}
function saveCard(id){const nm=document.getElementById('c_nm').value.trim();
  if(!nm)return toast('Enter the card name');
  const emis=[...document.querySelectorAll('#c_emis [data-emi]')].map(r=>({
    nm:r.querySelector('[data-enm]').value.trim(),mo:+r.querySelector('[data-emo]').value||0,
    tot:+r.querySelector('[data-etot]').value||0,start:r.querySelector('[data-est]').value}))
    .filter(e=>e.nm&&e.mo);
  const obj={nm,open:+document.getElementById('c_open').value||0,
    billDay:+document.getElementById('c_bd').value||'',dueDay:+document.getElementById('c_dd').value||'',emis};
  if(id){Object.assign(cardById(id),obj)}else{obj.id=uid();DB.cards.push(obj)}
  S();closeSheet();toast('✅ Card saved');go('card')}
function delCard(id){if(!confirm('Delete this card? Its expenses will remain in history.'))return;
  DB.cards=DB.cards.filter(c=>c.id!==id);S();closeSheet();go('card')}
function payForm(id){const c=cardById(id);
  openSheet(`<div class="xrow"><h3>💰 ${esc(c.nm)} — bill payment</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <input class="bigamt num" id="p_amt" type="number" inputmode="decimal" placeholder="₹ Amount paid">
  <label class="f">PAID FROM</label>
  <div class="chips" id="p_modes">${payModeChips('cash')}</div>
  <label class="f">DATE</label><input id="p_date" type="date" value="${today()}">
  <button class="btn" style="margin-top:14px" onclick="savePay('${id}')">💾 Save payment</button>
  <div class="mini" style="margin-top:8px">Card outstanding will reduce, and so will the account you paid from.</div>`)}
let PMODE='cash';
function payModeChips(sel){PMODE=sel;
  let h=`<button class="chip ${sel==='cash'?'on':''}" onclick="document.getElementById('p_modes').innerHTML=payModeChips('cash')">💵 Cash</button>`;
  DB.banks.forEach(b=>h+=`<button class="chip ${sel===b.id?'on':''}" onclick="document.getElementById('p_modes').innerHTML=payModeChips('${b.id}')">🏦 ${esc(b.nm)}</button>`);
  return h}
function savePay(id){const amt=+document.getElementById('p_amt').value;
  if(!amt||amt<=0)return toast('Enter the amount');
  DB.pays.push({id:uid(),date:document.getElementById('p_date').value||today(),cardId:id,from:PMODE,amt});
  S();closeSheet();toast('✅ Payment saved');go('card')}
function billCheck(id){const c=cardById(id);const mk=mkey();
  const prev=new Date();prev.setMonth(prev.getMonth()-1);const pk=prev.toISOString().slice(0,7);
  const html=k=>{const emis=emiActive(c,k),emiTot=emis.reduce((s,e)=>s+ +e.mo,0);
    const sp=DB.exps.filter(e=>e.mode===id&&mkey(e.date)===k);
    const spTot=sp.reduce((s,e)=>s+ +e.amt,0);
    const py=DB.pays.filter(p=>p.cardId===id&&mkey(p.date)===k).reduce((s,p)=>s+ +p.amt,0);
    return`<div class="box"><b>${mlabel(k)}</b>
    <div class="row between" style="margin-top:6px"><span class="mini">EMI total (${emis.length})</span><span class="num">${fmt(emiTot)}</span></div>
    <div class="row between"><span class="mini">New spends (${sp.length})</span><span class="num">${fmt(spTot)}</span></div>

    <div class="row between" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:6px"><b>Expected bill (EMI + spends)</b><b class="num">${fmt(emiTot+spTot)}</b></div>

function shopSplit(mk){

function prevKey(mk){const d=new Date(mk+'-01');d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)}
/* His question is not "what did I spend" — it is "kahan ZYADA kharch ho gaya".
   That is a comparison, so every line is this month against last month, biggest
   increase first. */
function moversHTML(mk){
  const pk=prevKey(mk);
  const sum=(k,cid)=>DB.exps.filter(e=>mkey(e.date)===k&&e.cat===cid).reduce((s,e)=>s+ +e.amt,0);
  const rows=DB.cats.map(c=>({c,now:sum(mk,c.id),was:sum(pk,c.id)}))
    .filter(r=>r.now||r.was).map(r=>({...r,d:r.now-r.was}))
    .sort((a,b)=>b.d-a.d);
  if(!rows.length)return '';
  const up=rows.filter(r=>r.d>0), down=rows.filter(r=>r.d<0);
  const line=r=>`<div class="item"><div class="em">${r.c.em}</div>
    <div class="grow"><div class="nm">${esc(r.c.nm)}</div>
      <div class="sub">${mlabel(pk)} ${fmt(r.was)} → ${mlabel(mk)} ${fmt(r.now)}</div></div>
    <div class="amt ${r.d>0?'out':'in'} num">${r.d>0?'+':'−'}${fmt(Math.abs(r.d))}</div></div>`;
  return `<h2 class="sec">Compared with ${mlabel(pk)}</h2>
  <div class="box">
    ${up.length?`<div class="mini" style="padding:4px 2px">Spent more</div>${up.slice(0,6).map(line).join('')}`:''}
    ${down.length?`<div class="mini" style="padding:8px 2px 4px;border-top:1px dashed var(--line)">Spent less</div>${down.slice(0,4).map(line).join('')}`:''}
  </div>`}
function insightsHTML(mk,sp,bud,cats,tr){
  const out=[];
  if(!sp)return`<div class="insight">Add entries for this month and the analysis will appear here.</div>`;
  const pk=prevKey(mk), prev=monthSpend(pk);
  // 1. where the money actually is
  if(cats[0])out.push(`Biggest head this month: <b>${cats[0].em} ${esc(cats[0].nm)}</b> — ${fmt(cats[0].v)}, ${Math.round(cats[0].v/sp*100)}% of everything you spent.`);
  // 2. the single line that answers "kahan zyada ho gaya"
  const sumC=(k,cid)=>DB.exps.filter(e=>mkey(e.date)===k&&e.cat===cid).reduce((s,e)=>s+ +e.amt,0);
  const movers=DB.cats.map(c=>({c,d:sumC(mk,c.id)-sumC(pk,c.id)})).filter(x=>x.d>0).sort((a,b)=>b.d-a.d);
  if(prev&&movers[0])out.push(`Sabse zyada badha: <b>${esc(movers[0].c.nm)}</b> — ${fmt(movers[0].d)} more than ${mlabel(pk)}. ${movers[1]?'Then '+esc(movers[1].c.nm)+' (+'+fmt(movers[1].d)+').':''}`);
  // 3. budgets crossed
  const overs=cats.filter(c=>+c.bud&&c.v>+c.bud);
  if(overs.length)out.push(`⚠️ Over budget: ${overs.map(c=>`<b>${esc(c.nm)}</b> (+${fmt(c.v-c.bud)})`).join(', ')}.`);
  // 4. the one saving worth making
  if(cats[0]&&+cats[0].bud===0)out.push(`💡 <b>${esc(cats[0].nm)}</b> ka koi budget set nahi hai. Ek limit rakhoge toh cross hone par app turant batayegi.`);
  // 5. month against month
  if(prev){const dd=sp-prev;
    out.push(dd>0?`Overall <b>${fmt(dd)} more</b> than ${mlabel(pk)} (${fmt(prev)}).`
                 :`Overall <b>${fmt(-dd)} less</b> than ${mlabel(pk)} — well done. 👍`)}
  // 6. what a small cut is worth
  if(cats[0]&&cats[0].v>0){const cut=Math.round(cats[0].v*0.2/100)*100;
    if(cut>=100)out.push(`Agar sirf <b>${esc(cats[0].nm)}</b> me 20% kam karo toh mahine ke <b>${fmt(cut)}</b> bachenge — saal ka ${fmt(cut*12)}.`)}
  // 7. shop vs personal, only when it is real
  const L=DB.exps.filter(e=>mkey(e.date)===mk);
  const shop=L.filter(e=>e.who==='shop').reduce((s,e)=>s+ +e.amt,0);
  if(shop)out.push(`Isme ${fmt(shop)} shop ka hai — apna personal kharcha ${fmt(sp-shop)} hua.`);
  return out.map(t=>`<div class="insight">${t}</div>`).join('')}
function drawBars(id,data,vert,budLine){
  const cv=document.getElementById(id);if(!cv)return;
  const W=cv.clientWidth||320,H=170;cv.width=W*2;cv.height=H*2;cv.style.height=H+'px';
  const x=cv.getContext('2d');x.scale(2,2);x.clearRect(0,0,W,H);
  if(!data.length||!data.some(d=>d.v>0)){x.fillStyle='#9aa8a0';x.font='13px sans-serif';x.textAlign='center';x.fillText('No data yet',W/2,H/2);return}
  const max=Math.max(...data.map(d=>d.v),budLine||0)*1.15;
  const n=data.length,gap=8,bw=Math.min(52,(W-20-gap*(n+1))/n);
  const x0=(W-(bw*n+gap*(n-1)))/2;
  data.forEach((d,i)=>{const h=max?d.v/max*(H-44):0;const bx=x0+i*(bw+gap),by=H-26-h;
    const g=x.createLinearGradient(0,by,0,H-26);
    g.addColorStop(0,d.hot?'#C29B3C':'#1F7A4D');g.addColorStop(1,d.hot?'#8A6A1E':'#123B2A');
    x.fillStyle=g;x.beginPath();
    if(x.roundRect)x.roundRect(bx,by,bw,h,[5,5,0,0]);else x.rect(bx,by,bw,h);
    x.fill();
    x.fillStyle='#1C2B24';x.font='600 10px sans-serif';x.textAlign='center';
    if(d.v)x.fillText((d.v>=1000?(d.v/1000).toFixed(d.v>=10000?0:1)+'k':Math.round(d.v)),bx+bw/2,by-5);
    x.fillStyle='#6B7A72';x.font='11px sans-serif';x.fillText(d.l,bx+bw/2,H-9)});
  if(budLine){const y=H-26-(budLine/max*(H-44));x.strokeStyle='#B3402A';x.setLineDash([5,4]);
    x.beginPath();x.moveTo(8,y);x.lineTo(W-8,y);x.stroke();x.setLineDash([]);
    x.fillStyle='#B3402A';x.font='600 10px sans-serif';x.textAlign='left';x.fillText('budget',10,y-4)}}

async function doBackup(){
  const auds={};for(const e of DB.exps){if(e.aud){const b=await audGet(e.id);
    if(b)auds[e.id]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}}
  const blob=new Blob([JSON.stringify({db:DB,auds})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='expense-manager-backup-'+today()+'.json';a.click();toast('✅ Backup downloaded')}
function doRestore(inp){const f=inp.files[0];if(!f)return;
  if(!confirm('Restoring will REPLACE all current data. Continue?'))return;
  const fr=new FileReader();fr.onload=async()=>{try{
    const d=JSON.parse(fr.result);DB=d.db;S();
    for(const id in (d.auds||{})){const res=await fetch(d.auds[id]);audPut(id,await res.blob())}
    toast('✅ Restore complete');go('home')}catch(e){toast('Could not read the file')}};
  fr.readAsText(f)}


/* ================= SHARED MESSAGE → EXPENSE =================
   Reading SMS directly is impossible from a web app, and Gmail's inbox permission would
   make him log in again every 7 days. Sharing works on BOTH: hold the bank SMS or the
   bank email → Share → Expense Manager, and the entry arrives already filled in.
   Nothing to set up, no login, no permission. */
function parseTxn(raw){
  if(!raw)return null;
  const s=String(raw).replace(/\s+/g,' ').trim();
  const low=s.toLowerCase();

  // amount — first money-looking figure
  let m=low.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/);
  if(!m)m=low.match(/([\d,]+\.\d{2})\s*(?:rs\.?|inr|₹)/);
  if(!m)return null;
  const amt=+m[1].replace(/,/g,'');
  if(!amt||amt<=0)return null;

  // direction
  const out=/\b(debit(?:ed)?|spent|paid|withdrawn|purchase|sent|deducted)\b/.test(low);
  const inn=/\b(credit(?:ed)?|received|deposit(?:ed)?|refund(?:ed)?)\b/.test(low);
  const dir = out&&!inn ? 'out' : (inn&&!out ? 'in' : (out?'out':'in'));

  // last 4 digits of the account or card it went through
  let acc=null;
  let a=s.match(/(?:a\/c|acct|account|card|ac)\s*(?:no\.?)?\s*[:# ]*\s*(?:x+|\*+|X+)?\s*(\d{4})\b/i)
      || s.match(/(?:x{2,}|\*{2,})\s*(\d{4})\b/i);
  if(a)acc=a[1];

  // who it went to
  let who=null;
  let w=s.match(/\b(?:to\s+VPA|to\s+vpa)\s+([^\s,.;]+)/i)
     || s.match(/\bat\s+([A-Z0-9][A-Za-z0-9 &._-]{2,30}?)(?:\s+on\b|\s+for\b|[.,;]|$)/)
     || s.match(/\bto\s+([A-Z][A-Za-z0-9 &._-]{2,30}?)(?:\s+on\b|[.,;]|$)/);
  if(w){ who=w[1].trim().replace(/@\w+$/,''); }
  if(who&&/^(your|a\/c|account|vpa)$/i.test(who))who=null;

  // date — dd-mm-yy(yy), dd/mm/yy, ddMonyy
  let date=null;
  let d=s.match(/\b(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})\b/);
  if(d){ let y=+d[3]; if(y<100)y+=2000; date=y+'-'+String(+d[2]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0'); }
  else{
    const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    d=s.match(/\b(\d{1,2})[- ]?([A-Za-z]{3})[- ]?(\d{2,4})\b/);
    if(d&&MON[d[2].toLowerCase()]){ let y=+d[3]; if(y<100)y+=2000;
      date=y+'-'+String(MON[d[2].toLowerCase()]).padStart(2,'0')+'-'+String(+d[1]).padStart(2,'0'); }
  }
  const isCard=/\bcard\b/i.test(s);
  return {amt,dir,acc,who,date,isCard};
}

/* Match the account/card the bank named to one he has added, by its last 4 digits. */
function accByLast4(d,isCard){
  if(!d)return null;
  const c=(DB.cards||[]).find(x=>String(x.nm).includes(d)||String(x.last4||'')===d);
  if(c)return c.id;
  const b=(DB.banks||[]).find(x=>String(x.nm).includes(d)||String(x.last4||'')===d);
  if(b)return b.id;
  return null;
}
function handleShared(){
  let txt='';
  try{ const q=new URLSearchParams(location.search);
    txt=[q.get('text'),q.get('title'),q.get('url')].filter(Boolean).join(' '); }catch(e){}
  if(!txt)return false;
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  const p=parseTxn(txt);
  if(!p){ toast('Is message me koi amount nahi mila'); return false; }
  sharedSheet(p,txt);
  return true;
}
function sharedSheet(p,raw){
  const mode=accByLast4(p.acc,p.isCard)||'cash';
  openSheet(`<div class="xrow"><h3>📩 Message se entry</h3><button class="x" onclick="closeSheet()">✕</button></div>
  <div class="box">
    <div class="row between"><b>${p.dir==='out'?'Kharcha':'Paisa aaya'}</b>
      <b class="amt ${p.dir==='out'?'out':'in'} num" style="font-size:22px">${fmt(p.amt)}</b></div>
    ${p.who?`<div class="mini" style="margin-top:4px">${esc(p.who)}</div>`:''}
    <div class="mini" style="margin-top:4px">${p.date?dfmt(p.date):'aaj'}${p.acc?' · ...'+p.acc:''}
      ${accByLast4(p.acc,p.isCard)?'':(p.acc?' <b style="color:var(--gold)">(ye account app me nahi hai)</b>':'')}</div>
  </div>
  <div class="mini" style="margin:8px 2px">${esc(raw.slice(0,140))}${raw.length>140?'…':''}</div>
  ${p.dir==='out'
    ? `<button class="btn" onclick="sharedToExpense(${p.amt},'${p.date||''}','${esc(p.who||'').replace(/'/g,"")}','${mode}')">🧾 Kharche me daalo</button>`
    : `<button class="btn" onclick="sharedToLedger(${p.amt},'${p.date||''}','${esc(p.who||'').replace(/'/g,"")}','${mode}')">⬇️ Paisa aaya — Ledger me daalo</button>`}
  <div class="mini" style="margin-top:10px">Category aur baaki cheezein agli screen pe chun lena.</div>`)}
function sharedToExpense(amt,date,who,mode){
  closeSheet(); F={cat:null,mode:mode||'cash',aud:null,who:'me'};
  go('exp');
  setTimeout(()=>{
    const a=document.getElementById('e_amt'); if(a)a.value=amt;
    const n=document.getElementById('e_note'); if(n&&who)n.value=who;
    const d=document.getElementById('e_date'); if(d&&date)d.value=date;
    toast('Category chuno aur save karo');
  },60)}
function sharedToLedger(amt,date,who,mode){
  closeSheet(); L={typ:'in',mode:(mode&&mode!=='cash')?mode:'cash',why:'',due:''};
  go('led');
  setTimeout(()=>{
    const a=document.getElementById('l_amt'); if(a)a.value=amt;
    const pn=document.getElementById('l_party'); if(pn&&who)pn.value=who;
    const d=document.getElementById('l_date'); if(d&&date)d.value=date;
    toast('Kiska paisa hai, confirm kar lo');
  },60)}
